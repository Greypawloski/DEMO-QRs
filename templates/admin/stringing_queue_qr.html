<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stringing Queue QR Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      gap: 20px;
      min-height: 100vh;
    }
    .screen-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 9px 22px;
      border: none;
      border-radius: 100px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
    }
    .btn-print { background: #059669; color: #fff; }
    .btn-download { background: #1d4ed8; color: #fff; }
    .btn-back  { background: #6b7280; color: #fff; }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 36px 40px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      max-width: 400px;
      width: 100%;
    }
    .card h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }
    .card .subtitle {
      font-size: 0.88rem;
      color: #6b7280;
      margin-bottom: 24px;
    }
    .qr-img {
      width: 240px;
      height: 240px;
      display: block;
      margin: 0 auto 20px;
    }
    .url-label {
      font-size: 0.78rem;
      color: #9ca3af;
      word-break: break-all;
    }
    @media print {
      body { background: none; padding: 0; display: block; }
      .screen-actions { display: none !important; }
      .card {
        box-shadow: none;
        border: none;
        padding: 24px;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="screen-actions">
    <button class="btn btn-print" onclick="window.print()">Print</button>
    <a class="btn btn-download" id="dl-btn" download="stringing-queue-qr.png">Download PNG</a>
    <a class="btn btn-back" href="{{ url_for('admin.dashboard') }}">← Back</a>
  </div>

  <div class="card">
    <h1>Racquet Stringing Queue</h1>
    <p class="subtitle">Scan to view racquets waiting to be strung</p>
    <img class="qr-img" src="data:image/png;base64,{{ qr_b64 }}" alt="Stringing Queue QR Code">
    <p class="url-label">{{ queue_url }}</p>
  </div>

  <script>
    document.getElementById('dl-btn').href = 'data:image/png;base64,{{ qr_b64 }}';
  </script>
</body>
</html>
