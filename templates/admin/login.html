<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Demo Checkout</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="kiosk-wrap" style="max-width:400px;padding-top:80px;">
    <div class="kiosk-header">
      <h1>Admin Login</h1>
    </div>

    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% if staff_names %}
      <div class="form-group">
        <label for="staff_name">Who are you?</label>
        <select id="staff_name" name="staff_name" required>
          <option value="" disabled selected>Select your name…</option>
          {% for name in staff_names %}
            <option value="{{ name }}">{{ name }}</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               {% if not staff_names %}autofocus{% endif %} required>
      </div>
      <button type="submit" class="btn btn-primary">Log In</button>
    </form>
  </div>
</body>
</html>
