<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} — Demo Checkout</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="admin-nav">
    <img src="{{ url_for('static', filename='sacc-logo.png') }}" alt="SACC" style="height:36px;filter:brightness(0) invert(1);margin-right:4px;">
    <span class="brand">Demo Checkout</span>
    <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
    <a href="{{ url_for('admin.equipment_list') }}">Equipment</a>
    <a href="{{ url_for('admin.history') }}">History</a>
    <a href="{{ url_for('admin.reports') }}">Reports</a>
    <a href="{{ url_for('admin.activity_log') }}">Activity</a>
    <a href="{{ url_for('restrings.list_restrings') }}">Restringing</a>
    <a href="{{ url_for('admin.member_search_page') }}">Member Search</a>
    <a href="{{ url_for('admin.kiosk_view') }}">Kiosk View</a>
    <a href="{{ url_for('admin.guide') }}">Staff Guide</a>
    {% if session.staff_name %}<span style="color:var(--muted);font-size:0.85rem;padding:0 4px;">{{ session.staff_name }}</span>{% endif %}
    <a href="{{ url_for('auth.logout') }}">Log Out</a>
  </nav>
  <div class="admin-wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
